<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">

<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#02060b"/>
    <stop offset="100%" stop-color="#07111a"/>
  </linearGradient>
  <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#78fbff"/>
    <stop offset="50%" stop-color="#ddffff"/>
    <stop offset="100%" stop-color="#61e8ff"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#63f1ff" stroke-opacity="0.08" stroke-width="1"/>
  </pattern>
  <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="1.1" fill="#d6ffff" opacity="0.03"/>
  </pattern>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.0"/>
  </filter>
</defs>

<rect width="100%" height="100%" rx="30" fill="url(#bgGrad)"/>
<rect width="100%" height="100%" rx="30" fill="url(#grid)"/>
<rect width="100%" height="100%" rx="30" fill="url(#scanlines)"/>

<circle cx="1260" cy="250" r="220" fill="#22ebff" opacity="0.028" filter="url(#softGlow)"/>
<circle cx="1040" cy="440" r="160" fill="#22ebff" opacity="0.018" filter="url(#softGlow)"/>

